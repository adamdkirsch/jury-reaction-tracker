<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Jury Reaction Tracker</title>
<style>
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #f4f5f7;
    color: #17191d;
  }
  .wrap {
    max-width: 780px;
    margin: 0 auto;
    padding: 16px 12px 28px;
  }
  h1 {
    margin: 0 0 10px;
    font-size: 24px;
  }
  .session-box, .controls, .summary, .saved {
    margin-bottom: 12px;
    padding: 12px;
    background: #fff;
    border: 1px solid #d7dce3;
    border-radius: 12px;
  }
  .session-box label, .saved-title {
    display: block;
    margin-bottom: 6px;
    font-size: 13px;
    font-weight: 700;
    color: #5b6470;
  }
  .session-box input {
    width: 100%;
    height: 44px;
    border: 1px solid #bfc6cf;
    border-radius: 8px;
    padding: 0 11px;
    font-size: 17px;
    background: white;
    box-sizing: border-box;
  }
  .jury {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .col {
    display: grid;
    grid-template-rows: repeat(9, 60px);
    gap: 7px;
  }
  .seat, .vacant {
    height: 60px;
    border-radius: 10px;
  }
  .seat {
    display: grid;
    grid-template-columns: 38px 1fr 34px;
    align-items: center;
    gap: 4px;
    padding: 5px;
    border: 1px solid #d7dce3;
    background: #fff;
  }
  .seat.selected {
    border: 3px solid #215da8;
    background: #edf4fd;
  }
  .name {
    font-size: 14px;
    font-weight: 800;
  }
  .select-btn {
    height: 38px;
    border: 1px solid #9aa3af;
    border-radius: 8px;
    background: #f8f9fb;
    font-size: 12px;
    font-weight: 750;
    cursor: pointer;
  }
  .seat.selected .select-btn {
    background: #215da8;
    border-color: #215da8;
    color: white;
  }
  .score {
    text-align: center;
    background: #eef0f3;
    border-radius: 999px;
    padding: 5px 0;
    font-size: 12px;
    font-weight: 800;
  }
  .vacant {
    border: 1px dashed #c8ced7;
    background: rgba(255,255,255,.45);
  }
  .controls {
    margin-top: 12px;
  }
  .selected-line {
    margin-bottom: 9px;
    font-size: 14px;
  }
  .selected-line strong {
    font-size: 20px;
    color: #215da8;
  }
  .arrows {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 9px;
  }
  .arrow {
    min-height: 66px;
    border: 1px solid #cfd5dd;
    border-radius: 10px;
    font-size: 32px;
    font-weight: 800;
  }
  .up { background: #e8f5ec; }
  .down { background: #fbeaea; }
  .arrow:disabled { opacity: .35; }
  .metrics {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 7px;
    text-align: center;
  }
  .metric {
    padding: 8px 3px;
    border-radius: 9px;
    background: #f6f7f9;
  }
  .metric b {
    display: block;
    font-size: 21px;
  }
  .metric span {
    font-size: 11px;
    color: #6b7280;
  }
  .actions {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    margin-top: 10px;
  }
  .action-btn {
    min-height: 42px;
    border: 1px solid #cfd5dd;
    border-radius: 8px;
    background: white;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
  }
  .save-btn {
    background: #215da8;
    border-color: #215da8;
    color: white;
  }
  .reset {
    color: #8a1c1c;
  }
  .saved {
    display: none;
  }
  .saved.visible {
    display: block;
  }
  .saved-list {
    display: grid;
    gap: 8px;
  }
  .saved-row {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 8px;
    align-items: center;
    padding: 9px;
    border-radius: 8px;
    background: #f6f7f9;
  }
  .saved-row strong {
    display: block;
    font-size: 14px;
  }
  .saved-row span {
    display: block;
    margin-top: 2px;
    font-size: 11px;
    color: #6b7280;
  }
  .load-btn {
    border: 1px solid #cfd5dd;
    border-radius: 7px;
    background: white;
    padding: 7px 10px;
    font-size: 12px;
    font-weight: 700;
  }

  @media (max-width: 560px) {
    .wrap { padding: 12px 10px 26px; }
    .jury { gap: 7px; }
    .col { grid-template-rows: repeat(9, 60px); gap: 7px; }
    .seat, .vacant { height: 60px; }
    .seat {
      grid-template-columns: 38px 1fr 34px;
      gap: 4px;
      padding: 5px;
    }
    .name { font-size: 14px; }
    .select-btn { height: 38px; font-size: 12px; }
    .score { font-size: 12px; }
    .actions { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Jury Reaction Tracker</h1>

  <div class="session-box">
    <label for="sessionName">SESSION NAME</label>
    <input id="sessionName" type="text" placeholder="e.g. Opening Statement">
  </div>

  <div class="jury">
    <div class="col">
      <div class="seat" data-name="J1"><div class="name">J1</div><button class="select-btn">Select</button><div class="score" id="score-J1">0</div></div>
      <div class="seat" data-name="J2"><div class="name">J2</div><button class="select-btn">Select</button><div class="score" id="score-J2">0</div></div>
      <div class="seat" data-name="J3"><div class="name">J3</div><button class="select-btn">Select</button><div class="score" id="score-J3">0</div></div>
      <div class="seat" data-name="J4"><div class="name">J4</div><button class="select-btn">Select</button><div class="score" id="score-J4">0</div></div>
      <div class="seat" data-name="J5"><div class="name">J5</div><button class="select-btn">Select</button><div class="score" id="score-J5">0</div></div>
      <div class="seat" data-name="J6"><div class="name">J6</div><button class="select-btn">Select</button><div class="score" id="score-J6">0</div></div>
      <div class="seat" data-name="J7"><div class="name">J7</div><button class="select-btn">Select</button><div class="score" id="score-J7">0</div></div>
      <div class="seat" data-name="J8"><div class="name">J8</div><button class="select-btn">Select</button><div class="score" id="score-J8">0</div></div>
      <div class="seat" data-name="J9"><div class="name">J9</div><button class="select-btn">Select</button><div class="score" id="score-J9">0</div></div>
    </div>

    <div class="col">
      <div class="seat" data-name="J10"><div class="name">J10</div><button class="select-btn">Select</button><div class="score" id="score-J10">0</div></div>
      <div class="seat" data-name="J11"><div class="name">J11</div><button class="select-btn">Select</button><div class="score" id="score-J11">0</div></div>
      <div class="seat" data-name="J12"><div class="name">J12</div><button class="select-btn">Select</button><div class="score" id="score-J12">0</div></div>
      <div class="seat" data-name="A1"><div class="name">A1</div><button class="select-btn">Select</button><div class="score" id="score-A1">0</div></div>
      <div class="seat" data-name="A2"><div class="name">A2</div><button class="select-btn">Select</button><div class="score" id="score-A2">0</div></div>
      <div class="seat" data-name="A3"><div class="name">A3</div><button class="select-btn">Select</button><div class="score" id="score-A3">0</div></div>
      <div class="seat" data-name="A4"><div class="name">A4</div><button class="select-btn">Select</button><div class="score" id="score-A4">0</div></div>
      <div class="vacant"></div>
      <div class="vacant"></div>
    </div>
  </div>

  <div class="controls">
    <div class="selected-line">Selected juror: <strong id="selectedName">None</strong></div>
    <div class="arrows">
      <button id="upBtn" class="arrow up" disabled>↑</button>
      <button id="downBtn" class="arrow down" disabled>↓</button>
    </div>
  </div>

  <div class="summary">
    <div class="metrics">
      <div class="metric"><b id="positiveTotal">0</b><span>Positive</span></div>
      <div class="metric"><b id="negativeTotal">0</b><span>Negative</span></div>
      <div class="metric"><b id="netTotal">0</b><span>Net</span></div>
    </div>

    <div class="actions">
      <button id="saveBtn" class="action-btn save-btn">Save Session</button>
      <button id="exportBtn" class="action-btn">Export CSV</button>
      <button id="resetBtn" class="action-btn reset">Reset Current</button>
    </div>
  </div>

  <div id="savedPanel" class="saved">
    <div class="saved-title">SAVED SESSIONS</div>
    <div id="savedList" class="saved-list"></div>
  </div>
</div>

<script>
(function() {
  const people = ["J1","J2","J3","J4","J5","J6","J7","J8","J9","J10","J11","J12","A1","A2","A3","A4"];
  let scores = Object.fromEntries(people.map(p => [p, 0]));
  let selected = null;
  let positive = 0;
  let negative = 0;

  const sessionName = document.getElementById("sessionName");
  const selectedName = document.getElementById("selectedName");
  const upBtn = document.getElementById("upBtn");
  const downBtn = document.getElementById("downBtn");
  const savedPanel = document.getElementById("savedPanel");
  const savedList = document.getElementById("savedList");

  function getSavedSessions() {
    try {
      return JSON.parse(localStorage.getItem("juryReactionSessions") || "[]");
    } catch {
      return [];
    }
  }

  function setSavedSessions(sessions) {
    localStorage.setItem("juryReactionSessions", JSON.stringify(sessions));
  }

  function selectJuror(name) {
    selected = name;
    document.querySelectorAll(".seat").forEach(s => {
      const active = s.dataset.name === name;
      s.classList.toggle("selected", active);
      const btn = s.querySelector(".select-btn");
      if (btn) btn.textContent = active ? "Selected" : "Select";
    });
    selectedName.textContent = name;
    upBtn.disabled = false;
    downBtn.disabled = false;
  }

  document.querySelectorAll(".seat").forEach(seat => {
    seat.querySelector(".select-btn").addEventListener("click", () => {
      selectJuror(seat.dataset.name);
    });
  });

  function updateSummary() {
    document.getElementById("positiveTotal").textContent = positive;
    document.getElementById("negativeTotal").textContent = negative;
    const net = positive - negative;
    document.getElementById("netTotal").textContent = net > 0 ? "+" + net : net;
  }

  function renderScores() {
    people.forEach(p => {
      document.getElementById("score-" + p).textContent = scores[p] || 0;
    });
    updateSummary();
  }

  function record(delta) {
    if (!selected) return;
    scores[selected] += delta;
    if (delta > 0) positive++;
    else negative++;
    renderScores();
  }

  upBtn.addEventListener("click", () => record(1));
  downBtn.addEventListener("click", () => record(-1));

  function currentSessionObject() {
    const now = new Date();
    return {
      id: now.getTime(),
      name: sessionName.value.trim() || "Untitled Session",
      savedAt: now.toISOString(),
      positive,
      negative,
      net: positive - negative,
      scores: {...scores}
    };
  }

  document.getElementById("saveBtn").addEventListener("click", function() {
    const sessions = getSavedSessions();
    sessions.unshift(currentSessionObject());
    setSavedSessions(sessions);
    renderSavedSessions();
    alert("Session saved on this device.");
  });

  function csvEscape(value) {
    const str = String(value ?? "");
    return '"' + str.replace(/"/g, '""') + '"';
  }

  document.getElementById("exportBtn").addEventListener("click", function() {
    const s = currentSessionObject();

    const rows = [
      ["Session Name", s.name],
      ["Saved At", s.savedAt],
      ["Positive Reactions", s.positive],
      ["Negative Reactions", s.negative],
      ["Net", s.net],
      [],
      ["Seat", "Net Score"]
    ];

    people.forEach(p => rows.push([p, s.scores[p]]));

    const csv = rows.map(row => row.map(csvEscape).join(",")).join("\r\n");
    const blob = new Blob([csv], {type: "text/csv;charset=utf-8;"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const safeName = s.name.replace(/[^a-z0-9_-]+/gi, "_").replace(/^_+|_+$/g, "") || "jury_session";
    a.href = url;
    a.download = safeName + ".csv";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  });

  document.getElementById("resetBtn").addEventListener("click", function() {
    if (!confirm("Reset the current session? Saved sessions will not be deleted.")) return;

    scores = Object.fromEntries(people.map(p => [p, 0]));
    selected = null;
    positive = 0;
    negative = 0;
    sessionName.value = "";

    document.querySelectorAll(".seat").forEach(s => {
      s.classList.remove("selected");
      s.querySelector(".select-btn").textContent = "Select";
    });

    selectedName.textContent = "None";
    upBtn.disabled = true;
    downBtn.disabled = true;
    renderScores();
  });

  function loadSession(session) {
    sessionName.value = session.name || "";
    scores = Object.fromEntries(people.map(p => [p, Number(session.scores?.[p] || 0)]));
    positive = Number(session.positive || 0);
    negative = Number(session.negative || 0);
    selected = null;

    document.querySelectorAll(".seat").forEach(s => {
      s.classList.remove("selected");
      s.querySelector(".select-btn").textContent = "Select";
    });

    selectedName.textContent = "None";
    upBtn.disabled = true;
    downBtn.disabled = true;
    renderScores();
    window.scrollTo({top: 0, behavior: "smooth"});
  }

  function renderSavedSessions() {
    const sessions = getSavedSessions();
    savedList.innerHTML = "";

    if (!sessions.length) {
      savedPanel.classList.remove("visible");
      return;
    }

    savedPanel.classList.add("visible");

    sessions.slice(0, 20).forEach(session => {
      const row = document.createElement("div");
      row.className = "saved-row";

      const info = document.createElement("div");
      const title = document.createElement("strong");
      title.textContent = session.name || "Untitled Session";

      const meta = document.createElement("span");
      const date = new Date(session.savedAt);
      meta.textContent = `${date.toLocaleString()} • Net ${session.net > 0 ? "+" : ""}${session.net}`;

      info.appendChild(title);
      info.appendChild(meta);

      const btn = document.createElement("button");
      btn.className = "load-btn";
      btn.textContent = "Load";
      btn.addEventListener("click", () => loadSession(session));

      row.appendChild(info);
      row.appendChild(btn);
      savedList.appendChild(row);
    });
  }

  renderScores();
  renderSavedSessions();
})();
</script>
</body>
</html>
